<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="852" viewBox="0 0 1332 852">
  <title>MEGA65 BASIC 65: FIND /HIGHLIGHT/ voorbeeld</title>
  <desc>BASIC 65-scherm met een syntaxgekleurd programma en twee FIND-commando&#39;s waarmee woorden in het programma worden opgelicht.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../fonts/mega40-Regular.ttf') format('truetype');
    }
    .b65 {
      font-family: 'Mega', monospace;
      font-size: 51.2px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="1332" height="852" rx="17" ry="17" fill="#000000"/>

  <!-- schermtekst: 80 kolommen x 25 rijen, cellen 16x32 op offset 26,26 -->
  <g transform="translate(26,26) scale(0.5,0.838)">
    <text class="b65" x="-2" y="36.99" fill="#00FF00" xml:space="preserve">READY.</text>
    <text class="b65" x="-2" y="75.18" fill="#00FF00" xml:space="preserve">LIST</text>
    <text class="b65" x="-2" y="151.55" fill="#00FF00" xml:space="preserve">10</text>
    <text class="b65" x="62" y="151.55" fill="#989AFF" xml:space="preserve"> REM KLEURENSCHEMA VAN PAPEGAAI</text>
    <text class="b65" x="-2" y="189.74" fill="#00FF00" xml:space="preserve">20</text>
    <text class="b65" x="94" y="189.74" fill="#FEFF00" xml:space="preserve">FONT</text>
    <text class="b65" x="254" y="189.74" fill="#00FF00" xml:space="preserve">B        :</text>
    <text class="b65" x="574" y="189.74" fill="#989AFF" xml:space="preserve">REM SCHREEF</text>
    <text class="b65" x="-2" y="227.92" fill="#00FF00" xml:space="preserve">30</text>
    <text class="b65" x="94" y="227.92" fill="#FEFF00" xml:space="preserve">FOREGROUND</text>
    <text class="b65" x="446" y="227.92" fill="#00FF00" xml:space="preserve">5  :</text>
    <text class="b65" x="574" y="227.92" fill="#989AFF" xml:space="preserve">REM GROEN</text>
    <text class="b65" x="-2" y="266.11" fill="#00FF00" xml:space="preserve">40</text>
    <text class="b65" x="94" y="266.11" fill="#FEFF00" xml:space="preserve">BACKGROUND</text>
    <text class="b65" x="446" y="266.11" fill="#00FF00" xml:space="preserve">0  :</text>
    <text class="b65" x="574" y="266.11" fill="#989AFF" xml:space="preserve">REM ZWART</text>
    <text class="b65" x="-2" y="304.3" fill="#00FF00" xml:space="preserve">50</text>
    <text class="b65" x="94" y="304.3" fill="#FEFF00" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="414" y="304.3" fill="#00FF00" xml:space="preserve">4,0 :</text>
    <text class="b65" x="574" y="304.3" fill="#989AFF" xml:space="preserve">REM SYSTEEM       PAARS</text>
    <text class="b65" x="-2" y="342.48" fill="#00FF00" xml:space="preserve">60</text>
    <text class="b65" x="94" y="342.48" fill="#FEFF00" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="382" y="342.48" fill="#00FF00" xml:space="preserve">14,1 :</text>
    <text class="b65" x="574" y="342.48" fill="#989AFF" xml:space="preserve">REM REM           BLAUW</text>
    <text class="b65" x="-2" y="380.67" fill="#00FF00" xml:space="preserve">70</text>
    <text class="b65" x="94" y="380.67" fill="#FEFF00" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="414" y="380.67" fill="#00FF00" xml:space="preserve">7,2 :</text>
    <text class="b65" x="574" y="380.67" fill="#989AFF" xml:space="preserve">REM SLEUTELWOORD  GEEL</text>
    <text class="b65" x="-2" y="457.04" fill="#00FF00" xml:space="preserve">READY.</text>
    <text class="b65" x="-2" y="495.23" fill="#00FF00" xml:space="preserve">FIND /CHE/</text>
    <text class="b65" x="-2" y="571.6" fill="#00FF00" xml:space="preserve">10 REM KLEURENS</text>
    <text class="b65" x="478" y="571.6" fill="#FE00FF" xml:space="preserve">CHE</text>
    <text class="b65" x="574" y="571.6" fill="#00FF00" xml:space="preserve">MA VAN PAPEGAAI</text>
    <text class="b65" x="-2" y="647.97" fill="#00FF00" xml:space="preserve">READY.</text>
    <text class="b65" x="-2" y="686.16" fill="#00FF00" xml:space="preserve">FIND /HIGHLIGHT/</text>
    <text class="b65" x="-2" y="762.53" fill="#00FF00" xml:space="preserve">50 </text>
    <text class="b65" x="94" y="762.53" fill="#FE00FF" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="382" y="762.53" fill="#00FF00" xml:space="preserve"> 4,0 :REM SYSTEEM       PAARS</text>
    <text class="b65" x="-2" y="800.72" fill="#00FF00" xml:space="preserve">60 </text>
    <text class="b65" x="94" y="800.72" fill="#FE00FF" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="382" y="800.72" fill="#00FF00" xml:space="preserve">14,1 :REM REM           BLAUW</text>
    <text class="b65" x="-2" y="838.9" fill="#00FF00" xml:space="preserve">70 </text>
    <text class="b65" x="94" y="838.9" fill="#FE00FF" xml:space="preserve">HIGHLIGHT</text>
    <text class="b65" x="382" y="838.9" fill="#00FF00" xml:space="preserve"> 7,2 :REM SLEUTELWOORD  GEEL</text>
    <text class="b65" x="-2" y="915.27" fill="#00FF00" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="27" y="794" width="16" height="32" fill="#00FF00"/>
</svg>
