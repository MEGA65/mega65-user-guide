<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: gok het getal (2)</title>
  <desc>Blauw C65-scherm zonder logo waarin programmaregel 2 opnieuw wordt ingetypt, nu met een hartje (PETSCII U+01B3) achter het aanhalingsteken.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="16.71" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">1 S$=23</text>
    <text class="screentext" x="-0.7" y="73.99" xml:space="preserve">2 PRINT "RAAD HET GETAL TUSSEN 1 EN 100"</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">3 INPUT "WAT IS UW GOK";G</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">4 IF G&lt;S$ THEN PRINT "MIJN GETAL IS GROTER"</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">5 IF G&gt;S$ THEN PRINT "MIJN GETAL IS KLEINER"</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">6 IF G=S$ THEN PRINT "GEFELICITEERD! U HEEFT MIJN GETAL GERADEN!"</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">2 PRINT"ƳRAAD HET GETAL TUSSEN 1 EN 100"</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">1 S$=23</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">2 PRINT"ƳRAAD HET GETAL TUSSEN 1 EN 100"</text>
    <text class="screentext" x="-0.7" y="303.1" xml:space="preserve">3 INPUT "WAT IS UW GOK";G</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">4 IF G&lt;S$ THEN PRINT "MIJN GETAL IS GROTER"</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">5 IF G&gt;S$ THEN PRINT "MIJN GETAL IS KLEINER"</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve">6 IF G=S$ THEN PRINT "GEFELICITEERD! U HEEFT MIJN GETAL GERADEN!"</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="336" width="8" height="16" fill="#F0F0F0"/>
</svg>
