<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: gok het getal (4)</title>
  <desc>Blauw C65-scherm zonder logo waarin de regels 15 FOR I = 1 TO 10 STEP 1 en 70 NEXT I aan het programma worden toegevoegd.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="16.71" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">10 S$=23</text>
    <text class="screentext" x="-0.7" y="73.99" xml:space="preserve">20 PRINT "ƳRAAD HET GETAL TUSSEN 1 EN 100"</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">30 INPUT "WAT IS UW GOK";G</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">40 IF G&lt;S$ THEN PRINT "MIJN GETAL IS GROTER"</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">50 IF G&gt;S$ THEN PRINT "MIJN GETAL IS KLEINER"</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">60 IF G=S$ THEN PRINT "GEFELICITEERD! U HEEFT MIJN GETAL GERADEN!"</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">15 FOR I = 1 TO 10 STEP 1</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">70 NEXT I</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">10 S$=23</text>
    <text class="screentext" x="-0.7" y="303.1" xml:space="preserve">15 FOR I = 1 TO 10 STEP 1</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">20 PRINT "ƳRAAD HET GETAL TUSSEN 1 EN 100"</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">30 INPUT"WAT IS UW GOK";G</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve">40 IF G&lt;S$ THEN PRINT "MIJN GETAL IS GROTER"</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">50 IF G&gt;S$ THEN PRINT "MIJN GETAL IS KLEINER"</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">60 IF G=S$ THEN PRINT "GEFELICITEERD! U HEEFT MIJN GETAL GERADEN!"</text>
    <text class="screentext" x="-0.7" y="417.66" xml:space="preserve">70 NEXT I</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
