<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: gok het getal (6)</title>
  <desc>Blauw C65-scherm met alleen de INPUT-prompt GUESS THE NUMBER BETWEEN 1 AND 100 en de vraag WHAT IS YOUR GUESS? met de cursor.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="35.8" xml:space="preserve">RAAD HET GETAL TUSSEN 1 EN 100</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">WAT IS UW GOK? </text>
  </g>

  <!-- cursor -->
  <rect x="120" y="32" width="8" height="16" fill="#F0F0F0"/>
</svg>
