<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: IF ... THEN met kleiner-dan</title>
  <desc>Blauw C65-scherm met gedeeltelijk zichtbaar regenbooglogo en de opstarttekst; vier IF ... THEN PRINT-opdrachten vergelijken getallen met 0.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- regenbooglogo -->
    <polygon points="0,-48 176,-48 168,-32 0,-32" fill="#F00000"/>
    <polygon points="0,-32 152,-32 144,-16 0,-16" fill="#F07070"/>
    <polygon points="0,-16 128,-16 120,0 0,0" fill="#F0F000"/>
    <polygon points="0,0 104,0 96,16 0,16" fill="#00F000"/>
    <polygon points="0,16 88,16 80,32 0,32" fill="#9090F0"/>
    <polygon points="0,32 72,32 64,48 0,48" fill="#F000F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="575.3" y="16.71" xml:space="preserve">COPYRIGHT  1977  MICROSOFT</text>
    <text class="screentext" x="399.3" y="54.89" xml:space="preserve">BASIC 10.0   V0.9B.911001    ALL RIGHTS RESERVED</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">ENGLISH KEYBOARD</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">NO EXPANSION RAM</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">C1565 DRIVE</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">ROM CHECKSUM $4BCF</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">IF -2 &lt; 0 THEN PRINT "-2 IS EEN NEGATIEF GETAL"</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">-2 IS EEN NEGATIEF GETAL</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">IF 2 &lt; 0 THEN PRINT "2 IS EEN NEGATIEF GETAL"</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">IF 0 &lt; -2 THEN PRINT "-2 IS EEN POSITIEF GETAL"</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">IF 0 &lt; 2 THEN PRINT "2 IS EEN POSITIEF GETAL"</text>
    <text class="screentext" x="-0.7" y="417.66" xml:space="preserve">2 IS EEN POSITIEF GETAL</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
