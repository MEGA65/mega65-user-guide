<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: INPUT met invoer LIGHT SABRE</title>
  <desc>Blauw C65-scherm met regenbooglogo en de opstarttekst; na RUN wordt LIGHT SABRE ingevoerd en toont het programma YOU TYPED LIGHT SABRE.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- regenbooglogo -->
    <polygon points="0,0 176,0 168,16 0,16" fill="#F00000"/>
    <polygon points="0,16 152,16 144,32 0,32" fill="#F07070"/>
    <polygon points="0,32 128,32 120,48 0,48" fill="#F0F000"/>
    <polygon points="0,48 104,48 96,64 0,64" fill="#00F000"/>
    <polygon points="0,64 88,64 80,80 0,80" fill="#9090F0"/>
    <polygon points="0,80 72,80 64,96 0,96" fill="#F000F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="495.3" y="16.71" xml:space="preserve">THE COMMODORE C65 DEVELOPMENT SYSTEM</text>
    <text class="screentext" x="431.3" y="54.89" xml:space="preserve">COPYRIGHT  1991  COMMODORE ELECTRONICS, LTD.</text>
    <text class="screentext" x="575.3" y="73.99" xml:space="preserve">COPYRIGHT  1977  MICROSOFT</text>
    <text class="screentext" x="399.3" y="112.17" xml:space="preserve">BASIC 10.0   V0.9B.911001    ALL RIGHTS RESERVED</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">ENGLISH KEYBOARD</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve">NO EXPANSION RAM</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">C1565 DRIVE</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">ROM CHECKSUM $4BCF</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">INPUT A$</text>
    <text class="screentext" x="-0.7" y="303.1" xml:space="preserve" fill="#F00000">?ILLEGAL DIRECT ERROR</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">1 INPUT A$</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve">2 PRINT "U VOERDE IN "; A$</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">RUN</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">? LICHTZWAARD</text>
    <text class="screentext" x="-0.7" y="417.66" xml:space="preserve">U VOERDE IN LICHTZWAARD</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
