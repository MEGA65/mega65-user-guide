<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: EXTRA IGNORED bij INPUT</title>
  <desc>Blauw C65-scherm zonder logo met het naamprogramma enkele keren uitgevoerd; bij de invoer RIMMER, BSC zonder aanhalingstekens meldt INPUT ?EXTRA IGNORED.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="16.71" xml:space="preserve">HOE HEET U</text>
    <text class="screentext" x="-0.7" y="35.8" xml:space="preserve">? LENNART</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">HELLO LENNART</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">RUN</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">HOE HEER U</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">? HELEEN</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve">HALLO HELEEN</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">RUN</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">HOE HEET U</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">? KAREL</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">HALLO KAREL</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">RUN</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve">HOE HEET U</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">? REMWAALS, HEER</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">?EXTRA IGNORED</text>
    <text class="screentext" x="-0.7" y="417.66" xml:space="preserve">HALLO REMWAALS</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
