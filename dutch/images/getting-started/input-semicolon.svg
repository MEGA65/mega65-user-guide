<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: puntkomma in INPUT</title>
  <desc>Blauw C65-scherm zonder logo met een puntkomma na de INPUT-prompt, zodat de invoer LISTER,3000000 direct achter de prompt verschijnt.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="16.71" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">2 INPUT "HOE HEET U EN WAT IS UW LEEFTIJD";A$,A</text>
    <text class="screentext" x="-0.7" y="73.99" xml:space="preserve">3 PRINT "HALLO "; A$</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">4 PRINT "U BENT"; A, " JAAR OUD."</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">RUN</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve">HOE HEET U EN WAT IS UW LEEFTIJD? LENNART,3000000</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">HELLO LENNART</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">U BENT 3000000  JAAR OUD.</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="208" width="8" height="16" fill="#F0F0F0"/>
</svg>
