<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: PRINT en ?</title>
  <desc>Blauw C65-scherm zonder logo met de invoer A en &quot;THIS IS A STRING&quot; (?SYNTAX ERROR), PRINT A en ? A (0), het programmaregel 1 ? A en de LIST-uitvoer 1 PRINT A.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="35.8" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">A</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve" fill="#F00000">?SYNTAX ERROR</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="131.26" xml:space="preserve">"DIT IS EEN STRING"</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve" fill="#F00000">?SYNTAX ERROR</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="207.64" xml:space="preserve">PRINT A</text>
    <text class="screentext" x="15.3" y="226.73" xml:space="preserve">0</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">? A</text>
    <text class="screentext" x="15.3" y="303.1" xml:space="preserve">0</text>
    <text class="screentext" x="-0.7" y="341.29" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve">1 ? A</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="417.66" xml:space="preserve">1 PRINT A</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
