<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: programmaregel vervangen</title>
  <desc>Blauw C65-scherm zonder logo waarin programmaregel 2 opnieuw wordt ingetypt om hem te vervangen; LIST toont daarna de nieuwe regel 2.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="16.71" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">1 PRINT "HOE HEET U EN WAT IS UW LEEFTIJD"</text>
    <text class="screentext" x="-0.7" y="73.99" xml:space="preserve">2 INPUT A$,A,B</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">3 PRINT "HALLO "; A$</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">4 PRINT "U BENT"; A, " JAAR OUD."</text>
    <text class="screentext" x="-0.7" y="150.36" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve">2 INPUT "HOE HEET U EN WAT IS UW LEEFTIJD",A$,A</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">LIST</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">1 PRINT "HOE HEET U EN WAT IS UW LEEFTIJD"</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">2 INPUT "HOE HEET U EN WAT IS UW LEEFTIJD",A$,A</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">3 PRINT "HALLO "; A$</text>
    <text class="screentext" x="-0.7" y="284.01" xml:space="preserve">4 PRINT "U BENT"; A, " JAAR OUD."</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="272" width="8" height="16" fill="#F0F0F0"/>
</svg>
