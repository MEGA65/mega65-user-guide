<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>MEGA65 C65-scherm: TYPE MISMATCH ERROR</title>
  <desc>Blauw C65-scherm zonder logo met LET-opdrachten en de foutmelding ?TYPE MISMATCH ERROR bij het toekennen van een tekenreeks aan een numerieke variabele en omgekeerd.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond -->
  <rect x="0" y="0" width="640" height="400" fill="#0100F0"/>

  <!-- schermtekst -->
  <g transform="scale(0.5,0.838)" fill="#F0F0F0">
    <text class="screentext" x="-0.7" y="35.8" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="54.89" xml:space="preserve">LET N = 5.3</text>
    <text class="screentext" x="-0.7" y="93.08" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="112.17" xml:space="preserve">? N</text>
    <text class="screentext" x="15.3" y="131.26" xml:space="preserve">5.3</text>
    <text class="screentext" x="-0.7" y="169.45" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="188.54" xml:space="preserve">LET N$ = "DE KONING DER AARDAPPELMENSEN"</text>
    <text class="screentext" x="-0.7" y="226.73" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="245.82" xml:space="preserve">? N$</text>
    <text class="screentext" x="-0.7" y="264.92" xml:space="preserve">DE KONING DER AARDAPPELMENSEN</text>
    <text class="screentext" x="-0.7" y="303.1" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="322.2" xml:space="preserve">LET N = "HEER FIEBEL"</text>
    <text class="screentext" x="-0.7" y="360.38" xml:space="preserve" fill="#F00000">?TYPE MISMATCH ERROR</text>
    <text class="screentext" x="-0.7" y="379.47" xml:space="preserve">READY.</text>
    <text class="screentext" x="-0.7" y="398.57" xml:space="preserve">LET N$ = 42</text>
    <text class="screentext" x="-0.7" y="436.75" xml:space="preserve" fill="#F00000">?TYPE MISMATCH ERROR</text>
    <text class="screentext" x="-0.7" y="455.85" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  <rect x="0" y="384" width="8" height="16" fill="#F0F0F0"/>
</svg>
