<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="685" height="372" viewBox="0 0 685 372">
  <title>VIC-banken en geheugenindeling</title>
  <desc>Geheugenkaart met Bank 0 en Bank 1, onderverdeeld in VIC Bank 0 tot en met 3.</desc>

  <rect x="0" y="0" width="685" height="372" fill="#FFFFFF"/>

  <!-- vlakken -->
  <rect x="53" y="40" width="480" height="80" fill="#D4E1F5"/>
  <rect x="53" y="120" width="480" height="80" fill="#BED2EF"/>
  <rect x="53" y="200" width="480" height="80" fill="#D4E1F5"/>
  <rect x="53" y="280" width="480" height="80" fill="#BED2EF"/>

  <!-- lichte rasterlijnen -->
  <g stroke="#89A5CF" stroke-width="1" fill="none">
    <line x1="53" y1="120" x2="533" y2="120"/>
    <line x1="53" y1="200" x2="533" y2="200"/>
    <line x1="53" y1="280" x2="533" y2="280"/>
    <line x1="533" y1="40" x2="533" y2="360"/>
    <line x1="173" y1="40" x2="293" y2="40"/>
    <line x1="413" y1="40" x2="533" y2="40"/>
    <line x1="173" y1="360" x2="293" y2="360"/>
    <line x1="413" y1="360" x2="533" y2="360"/>
  </g>

  <!-- donkere lijnen -->
  <g stroke="#556276" stroke-width="1" fill="none">
    <line x1="53" y1="40" x2="173" y2="40"/>
    <line x1="293" y1="40" x2="413" y2="40"/>
    <line x1="53" y1="360" x2="173" y2="360"/>
    <line x1="293" y1="360" x2="413" y2="360"/>
    <line x1="53" y1="40" x2="53" y2="360"/>
    <line x1="173" y1="40" x2="173" y2="360"/>
    <line x1="293" y1="40" x2="293" y2="360"/>
    <line x1="413" y1="40" x2="413" y2="360"/>
    <line x1="53" y1="80" x2="173" y2="80"/>
    <line x1="293" y1="80" x2="413" y2="80"/>
    <line x1="53" y1="320" x2="173" y2="320"/>
    <line x1="293" y1="320" x2="413" y2="320"/>
  </g>

  <!-- koppen -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="112" y="18">Bank 0</text>
    <text x="344" y="18">Bank 1</text>
  </g>

  <!-- linker adreslabels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="end">
    <text x="49" y="44">$FFFF</text>
    <text x="49" y="84">$D000</text>
    <text x="49" y="204">$8000</text>
    <text x="49" y="324">$2000</text>
    <text x="49" y="364">$0000</text>
  </g>

  <!-- rechter VIC-banklabels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000000">
    <text x="545" y="101" font-weight="bold">VIC Bank 3</text>
    <text x="545" y="116">$C000-$FFF</text>
    <text x="545" y="181" font-weight="bold">VIC Bank 2</text>
    <text x="545" y="196">$8000-$BFFF</text>
    <text x="545" y="261" font-weight="bold">VIC Bank 1</text>
    <text x="545" y="276">$4000-$7FFF</text>
    <text x="545" y="341" font-weight="bold">VIC Bank 0</text>
    <text x="545" y="356">$0000-$3FFF</text>
  </g>

  <!-- bloklabels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <text x="112" y="63" fill="#556276">Bitplanes</text>
    <text x="348" y="63" fill="#556276">Bitplanes</text>
    <text x="113" y="192" fill="#525252">BASIC-code</text>
    <text x="112" y="211" fill="#556276">$2000-$0FF00</text>
    <text x="354" y="191" fill="#525252">BASIC-variabelen</text>
    <text x="353" y="211" fill="#556276">$2000-$F7FF</text>
    <text x="113" y="333" fill="#525252">Schermgeheugen</text>
    <text x="112" y="346" fill="#556276">$0800-$0FFF</text>
  </g>
</svg>
