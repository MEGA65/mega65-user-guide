<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="564" height="286" viewBox="0 0 564 286">
  <title>MEGA65 BASIC 65: gebruik van HIGHLIGHT</title>
  <desc>BASIC 65-scherm waarin het commando HIGHLIGHT 0,2 de kleur van het trefwoord PRINT verandert in het programma dat met LIST wordt getoond.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../fonts/mega40-Regular.ttf') format('truetype');
    }
    .b65 {
      font-family: 'Mega', monospace;
      font-size: 25.6px;
    }
  </style>

  <!-- achtergrond met afgeronde hoeken (buiten de hoeken transparant) -->
  <rect x="0" y="0" width="564" height="286" rx="14" ry="14" fill="#000000"/>

  <!-- schermtekst: cellen 8x16, 16 rijen, tekst vanaf kolom 2 -->
  <g clip-path="url(#scherm)">
  <g transform="translate(0,13) scale(0.5,0.838)">
    <text class="b65" x="32.0" y="16.71" fill="#F0F0F0" xml:space="preserve">LIST</text>
    <text class="b65" x="32.0" y="54.89" fill="#F0F0F0" xml:space="preserve">10</text>
    <text class="b65" x="80.0" y="54.89" fill="#B0B0B0" xml:space="preserve">REM *** DIT IS HALLO WERELD ***</text>
    <text class="b65" x="32.0" y="73.99" fill="#F0F0F0" xml:space="preserve">20</text>
    <text class="b65" x="80.0" y="73.99" fill="#90F090" xml:space="preserve">PRINT</text>
    <text class="b65" x="176.0" y="73.99" fill="#F0F0F0" xml:space="preserve">"HALLO WERELD"</text>
    <text class="b65" x="32.0" y="112.17" fill="#F0F0F0" xml:space="preserve">READY.</text>
    <text class="b65" x="32.0" y="131.26" fill="#F0F0F0" xml:space="preserve">HIGHLIGHT 0,2</text>
    <text class="b65" x="32.0" y="169.45" fill="#F0F0F0" xml:space="preserve">READY.</text>
    <text class="b65" x="32.0" y="188.54" fill="#F0F0F0" xml:space="preserve">LIST</text>
    <text class="b65" x="32.0" y="226.73" fill="#F0F0F0" xml:space="preserve">10</text>
    <text class="b65" x="80.0" y="226.73" fill="#B0B0B0" xml:space="preserve">REM *** DIT IS HALLO WERELD ***</text>
    <text class="b65" x="32.0" y="245.82" fill="#F0F0F0" xml:space="preserve">20</text>
    <text class="b65" x="80.0" y="245.82" fill="#F06000" xml:space="preserve">PRINT</text>
    <text class="b65" x="176.0" y="245.82" fill="#F0F0F0" xml:space="preserve">"HALLO WERELD"</text>
    <text class="b65" x="32.0" y="284.01" fill="#F0F0F0" xml:space="preserve">READY.</text>
  </g>

  <!-- cursor -->
  </g>
  <rect x="16" y="253" width="8" height="16" fill="#F0F0F0"/>
</svg>
