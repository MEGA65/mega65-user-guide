<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1407" height="940" viewBox="0 0 1407 940">
  <title>MEGA65 GO64 BASIC V2 opstartscherm</title>
  <desc>Blauw C64-scherm met de tekst **** MEGA65 GO64 BASIC V2 ****, 64K RAM SYSTEM 38911 BASIC BYTES FREE en READY.</desc>

  <style type="text/css">
    @font-face {
      font-family: 'Mega';
      src: url('../fonts/mega40-Regular.ttf') format('truetype');
    }
    .screentext {
      font-family: 'Mega', monospace;
      font-size: 50.05px;
      fill: #989AFB;
    }
  </style>

  <!-- lavendelkleurige rand -->
  <rect x="0" y="0" width="1407" height="940" fill="#9A9CEE"/>

  <!-- blauw scherm (40 x 25 tekens) -->
  <rect x="77" y="82" width="1252" height="782" fill="#001EED"/>

  <!-- schermtekst: horizontaal op de 40-koloms gridmaat, verticaal
       samengedrukt tot de verhouding van de karakterset op het scherm -->
  <g transform="scale(1,0.827)">
    <text class="screentext" x="233.4" y="170.5" xml:space="preserve">**** MEGA65 GO64 BASIC V2 ****</text>
    <text class="screentext" x="108.28" y="245.5" xml:space="preserve">64K RAM SYSTEM  38911 BASIC BYTES FREE</text>
    <text class="screentext" x="77" y="321.6" xml:space="preserve">READY.</text>
  </g>
</svg>
